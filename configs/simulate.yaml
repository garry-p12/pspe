# Phase 1: neural-operator surrogate training.
defaults:
  - _self_

testbed: dar          # dar | swe | rdf
surrogate: fno        # fno | deeponet | gnot | fno_neuralop
device: auto          # auto | cuda | mps | cpu
seed: 0

train:
  epochs: 20
  batch: 16
  horizon: 4          # rollout-consistency horizon during training
  lr: 1.0e-3
  weight_decay: 1.0e-5
  use_physics: true   # ablation switch
  # Channel-padded head: train on one PDE family, roll out on another. Required
  # for the cross-family transfer gap; slightly larger than a bespoke model.
  padded: false
  physics_weight: 0.1
  rollout_weight: 1.0
  eval_horizon: 16
  grid: 64
  amp: true

model:
  modes: 12           # FNO spectral truncation (the reduced order)
  width: 32
  n_layers: 4

output:
  log_dir: runs/simulate
  checkpoint: runs/simulate/surrogate.pt

hydra:
  run:
    dir: outputs/simulate/${now:%Y-%m-%d_%H-%M-%S}
