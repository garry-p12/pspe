   <g id="text_1">
    <text style="fill: #1f6b4f; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="54.563269" transform="rotate(-0 110.011406 54.563269)">Differentiable model</text>
   </g>
   <g id="text_2">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="70.207472" transform="rotate(-0 110.011406 70.207472)">roll the surrogate forward,</text>
   </g>
   <g id="text_3">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="84.621872" transform="rotate(-0 110.011406 84.621872)">differentiate through it</text>
   </g>
   <g id="text_4">
    <text style="fill: #37474f; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="182.075269" transform="rotate(-0 110.011406 182.075269)">Real environment</text>
   </g>
   <g id="text_5">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="197.719472" transform="rotate(-0 110.011406 197.719472)">sample, score, no gradient</text>
   </g>
   <g id="text_6">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="110.011406" y="212.133872" transform="rotate(-0 110.011406 212.133872)">through the dynamics</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f6b4f; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="54.563269" transform="rotate(-0 280.201406 54.563269)">Pathwise</text>
   </g>
   <g id="text_8">
    <!-- $g_{\mathrm{pw}}$ -->
    <g style="fill: #222222" transform="translate(274.081406 69.340206)">
     <text>
      <tspan style="font: 8.5px 'cmmi10'" x="0" y="-0.25">g</tspan>
      <tspan style="font: 5.95px 'cmr10'" x="4.054932 7.358228" y="1.1955312500000002">pw</tspan>
     </text>
    </g>
   </g>
   <g id="text_9">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="84.621872" transform="rotate(-0 280.201406 84.621872)">low variance,</text>
   </g>
   <g id="text_10">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="99.036272" transform="rotate(-0 280.201406 99.036272)">biased by model error</text>
   </g>
   <g id="text_11">
    <text style="fill: #37474f; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="182.075269" transform="rotate(-0 280.201406 182.075269)">Likelihood ratio</text>
   </g>
   <g id="text_12">
    <!-- $g_{\mathrm{lr}}$ -->
    <g style="fill: #222222" transform="translate(275.908906 197.702206)">
     <text>
      <tspan style="font: 8.5px 'cmmi10'" x="0" y="-0.25">g</tspan>
      <tspan style="font: 5.95px 'cmr10'" x="4.054932 5.702222" y="1.1955312500000002">lr</tspan>
     </text>
    </g>
   </g>
   <g id="text_13">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="212.133872" transform="rotate(-0 280.201406 212.133872)">unbiased,</text>
   </g>
   <g id="text_14">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="280.201406" y="226.548272" transform="rotate(-0 280.201406 226.548272)">high variance</text>
   </g>
   <g id="text_15">
    <text style="fill: #b0561a; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="450.391406" y="98.915269" transform="rotate(-0 450.391406 98.915269)">Mixing rule</text>
   </g>
   <g id="text_16">
    <!-- $g = \alpha\, g_{\mathrm{pw}} + (1-\alpha)\, g_{\mathrm{lr}}$ -->
    <g style="fill: #222222" transform="translate(411.461406 114.4758)">
     <text>
      <tspan style="font: 8.5px 'cmmi10'" x="0 13.643164 20.319784 59.243011 69.219191" y="-0.625">g®g®g</tspan>
      <tspan style="font: 8.5px 'cmr10'" x="5.547412 34.009466 42.105218 45.404778 64.675872" y="-0.625">=+(1)</tspan>
      <tspan style="font: 5.95px 'cmr10'" x="24.374716 27.678012 73.274123 74.921413" y="0.8205312500000002">pwlr</tspan>
      <tspan style="font: 8.5px 'cmsy10'" x="51.147259" y="-0.625">¡</tspan>
     </text>
    </g>
   </g>
   <g id="text_17">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="450.391406" y="143.388272" transform="rotate(-0 450.391406 143.388272)">choose α to minimise</text>
   </g>
   <g id="text_18">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="450.391406" y="157.802672" transform="rotate(-0 450.391406 157.802672)">the variance of g</text>
   </g>
   <g id="text_19">
    <text style="fill: #b0561a; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="591.286406" y="54.563269" transform="rotate(-0 591.286406 54.563269)">Policy</text>
   </g>
   <g id="text_20">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="591.286406" y="70.207472" transform="rotate(-0 591.286406 70.207472)">update</text>
   </g>
   <g id="text_21">
    <text style="fill: #5b3f85; font: 700 9.8px 'DejaVu Sans'; text-anchor: middle" x="591.286406" y="182.075269" transform="rotate(-0 591.286406 182.075269)">PID dual</text>
   </g>
   <g id="text_22">
    <!-- $\lambda$ on the -->
    <g style="fill: #222222" transform="translate(573.818906 197.719472)">
     <text>
      <tspan style="font: 8.5px 'cmmi10'" x="0" y="-0.15625">¸</tspan>
      <tspan style="font: 8.5px 'DejaVu Sans'" x="4.955566 7.657471 12.85791 18.245117 20.947021 24.279785 29.666992" y="-0.15625"> on the</tspan>
     </text>
    </g>
   </g>
   <g id="text_23">
    <text style="fill: #222222; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="591.286406" y="212.133872" transform="rotate(-0 591.286406 212.133872)">budget</text>
   </g>
   <g id="text_24">
    <text style="fill: #666666; font: italic 8.5px 'DejaVu Sans'; text-anchor: middle" x="349.951406" y="294.3792" transform="rotate(-0 349.951406 294.3792)">the policy is re-measured on the REAL environment, not on the model that trained it</text>
   </g>
   <g id="text_25">
    <text style="fill: #222222; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="338.791406" y="17.1792" transform="rotate(-0 338.791406 17.1792)">The estimator: a biased cheap gradient and an unbiased expensive one, combined at the variance-minimising weight</text>
   </g>
