   <g id="text_1">
    <text style="fill: #1f6b4f; font: 700 9.5px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="43.236" transform="rotate(-0 119.486297 43.236)">the component metric said</text>
   </g>
   <g id="text_2">
    <text style="fill: #a12a2a; font: 700 9.5px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="43.236" transform="rotate(-0 331.526297 43.236)">the decision in fact</text>
   </g>
   <g id="text_3">
    <text style="fill: #b0561a; font: 700 9.5px 'DejaVu Sans'; text-anchor: middle" x="554.726297" y="43.236" transform="rotate(-0 554.726297 43.236)">what exposed it</text>
   </g>
   <g id="text_4">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="78.735094" transform="rotate(-0 119.486297 78.735094)">surrogate cost satisfied the dual</text>
   </g>
   <g id="text_5">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="78.735094" transform="rotate(-0 331.526297 78.735094)">7.3% of real evaluations violated</text>
   </g>
   <g id="text_6">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="78.735094" transform="rotate(-0 557.516297 78.735094)">probe the true environment</text>
   </g>
   <g id="text_7">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="113.107894" transform="rotate(-0 119.486297 113.107894)">one-step forecast skill high</text>
   </g>
   <g id="text_8">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="113.107894" transform="rotate(-0 331.526297 113.107894)">open-loop rollout invents a fire</text>
   </g>
   <g id="text_9">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="113.107894" transform="rotate(-0 557.516297 113.107894)">sync to observation</text>
   </g>
   <g id="text_10">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="147.480694" transform="rotate(-0 119.486297 147.480694)">faithfulness 0.47 vs 0.18, t = +21</text>
   </g>
   <g id="text_11">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="147.480694" transform="rotate(-0 331.526297 147.480694)">briefs carry zero state information</text>
   </g>
   <g id="text_12">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="147.480694" transform="rotate(-0 557.516297 147.480694)">permutation control</text>
   </g>
   <g id="text_13">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="181.853494" transform="rotate(-0 119.486297 181.853494)">reconstruction AP 0.594 vs 0.006</text>
   </g>
   <g id="text_14">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="181.853494" transform="rotate(-0 331.526297 181.853494)">decision worse in 0 of 9 configs</text>
   </g>
   <g id="text_15">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="181.853494" transform="rotate(-0 557.516297 181.853494)">score the belief on the decision</text>
   </g>
   <g id="text_16">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="216.226294" transform="rotate(-0 119.486297 216.226294)">solver matches reference, CSI 0.979</text>
   </g>
   <g id="text_17">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="216.226294" transform="rotate(-0 331.526297 216.226294)">reference matches satellite at 0.535</text>
   </g>
   <g id="text_18">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="216.226294" transform="rotate(-0 557.516297 216.226294)">score the reference too</text>
   </g>
   <g id="text_19">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="119.486297" y="250.599094" transform="rotate(-0 119.486297 250.599094)">twin loop improved 8 of 8, t = 3.0</text>
   </g>
   <g id="text_20">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="331.526297" y="250.599094" transform="rotate(-0 331.526297 250.599094)">at 607 fires, a third the size</text>
   </g>
   <g id="text_21">
    <text style="fill: #222222; font: 8.1px 'DejaVu Sans'; text-anchor: middle" x="557.516297" y="250.599094" transform="rotate(-0 557.516297 250.599094)">test at a size that can be wrong</text>
   </g>
   <g id="text_22">
    <text style="fill: #666666; font: italic 8.6px 'DejaVu Sans'; text-anchor: middle" x="345.476297" y="276.084" transform="rotate(-0 345.476297 276.084)">Each row: a component whose own metric certified it. The map from component metric to decision quality is not monotone, and in three cases it is inverted.</text>
   </g>
  </g>
 </g>
