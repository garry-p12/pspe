   <text style="fill: #666666; font: italic 8.2px 'DejaVu Sans'; text-anchor: middle" x="528.979453" y="230.3505" transform="rotate(-0 528.979453 230.3505)">The only matched comparison is variance rule against fixed α: p = 0.083 at 20 seeds, which does not separate on the mean. Eq. 8 spends 75% more real data, so its zero is not attributable to the rule. What holds: α is a VARIANCE effect, not a mean one.</text>
