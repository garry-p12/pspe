  <g id="text_27">
   <text style="fill: #666666; font: italic 8.2px 'DejaVu Sans'; text-anchor: middle" x="390.115656" y="250.7265" transform="rotate(-0 390.115656 250.7265)">Circles are feasible, crosses are not. Three of four published safe-RL methods finish outside the budget — two of them on every evaluation episode — and still score below the deadband.</text>
