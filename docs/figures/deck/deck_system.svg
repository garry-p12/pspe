   <g id="text_1">
    <text style="fill: #37474f; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="50.008584" y="45.610922" transform="rotate(-0 50.008584 45.610922)">THE REAL WORLD</text>
   </g>
   <g id="text_2">
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'; text-anchor: start" x="235.512446" y="45.22461" transform="rotate(-0 235.512446 45.22461)">satellites, river gauges, road networks</text>
   </g>
   <g id="text_3">
    <text style="fill: #2b5d8c; font: 700 11.5px 'DejaVu Sans'; text-anchor: middle" x="126.707296" y="114.770732" transform="rotate(-0 126.707296 114.770732)">PERCEIVE</text>
   </g>
   <g id="text_4">
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(89.523046 156.083806)">what was seen,</text>
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(84.081046 166.833706)">and what was not</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f6b4f; font: 700 11.5px 'DejaVu Sans'; text-anchor: middle" x="325.053734" y="114.770732" transform="rotate(-0 325.053734 114.770732)">SIMULATE</text>
   </g>
   <g id="text_6">
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(308.681234 156.083806)">push it</text>
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(306.650234 166.833706)">forward</text>
   </g>
   <g id="text_7">
    <text style="fill: #b0561a; font: 700 11.5px 'DejaVu Sans'; text-anchor: middle" x="523.400172" y="114.770732" transform="rotate(-0 523.400172 114.770732)">PLAN</text>
   </g>
   <g id="text_8">
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(489.281922 156.083806)">choose, under</text>
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(501.914172 166.833706)">a budget</text>
   </g>
   <g id="text_9">
    <text style="fill: #5b3f85; font: 700 11.5px 'DejaVu Sans'; text-anchor: middle" x="721.746609" y="114.770732" transform="rotate(-0 721.746609 114.770732)">EXPLAIN</text>
   </g>
   <g id="text_10">
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(688.895859 156.083806)">say why, with</text>
    <text style="fill: #222222; font: 9.6px 'DejaVu Sans'" transform="translate(692.503359 166.833706)">a guarantee</text>
   </g>
   <g id="text_11">
    <text style="fill: #37474f; font: 9px 'DejaVu Sans'; text-anchor: start" x="92.817167" y="80.839024" transform="rotate(-0 92.817167 80.839024)">observe</text>
   </g>
   <g id="text_12">
    <text style="fill: #a12a2a; font: 9px 'DejaVu Sans'; text-anchor: start" x="685.002575" y="80.839024" transform="rotate(-0 685.002575 80.839024)">act</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f6b4f; font: 700 10.8px 'DejaVu Sans'; text-anchor: middle" x="126.707296" y="259.160976" transform="rotate(-0 126.707296 259.160976)">Re-anchor</text>
   </g>
   <g id="text_14">
    <text style="fill: #222222; font: 9px 'DejaVu Sans'" transform="translate(75.694171 294.868812)">replace the guess with</text>
    <text style="fill: #222222; font: 9px 'DejaVu Sans'" transform="translate(74.077687 304.946843)">what was actually seen</text>
   </g>
