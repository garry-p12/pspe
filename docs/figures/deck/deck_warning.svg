  <g id="text_22">
   <text style="fill: #666666; font: italic 8.2px 'DejaVu Sans'; text-anchor: middle" x="597.795391" y="230.305351" transform="rotate(-0 597.795391 230.305351)">Median 4 h 45 min — on the four it recorded. The two largest floods since the gauge was built left no trace at all, and one of the four it did see gave 20 minutes. A median over the days the instrument worked describes the warning available during the floods nobody needed warning for.</text>
