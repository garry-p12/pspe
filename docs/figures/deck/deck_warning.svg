   <g id="text_20">
    <text style="fill: #a12a2a; font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="634.421544" y="37.488932" transform="rotate(-0 634.421544 37.488932)">no usable trace — the gauge was silent</text>
   </g>
