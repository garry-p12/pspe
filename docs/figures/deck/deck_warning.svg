   <g id="text_19">
    <text style="fill: #222222; font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="428.215391" y="15.127351" transform="rotate(-0 428.215391 15.127351)">Measured, not modelled: how much notice the gauge actually gave</text>
