   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2b5d8c" x="36.216" y="98.057929" transform="rotate(-0 36.216 98.057929)">WHAT IT DOES</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="123.956966" transform="rotate(-0 36.216 123.956966)">A frozen vision backbone with LoRA adapters, a field decoder and a contrastive text head.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="149.907604" transform="rotate(-0 36.216 149.907604)">Under occlusion a self supervised estimator fills the cells the satellite did not see.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="175.858242" transform="rotate(-0 36.216 175.858242)">Occlusion is generated spatially correlated, so a blob covers the front, not stray pixels.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f6b4f" x="36.216" y="238.427291" transform="rotate(-0 36.216 238.427291)">WHAT HELD UP</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="263.094792" transform="rotate(-0 36.216 263.094792)">Losing 60 percent of the observation</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="285.506707" transform="rotate(-0 36.216 285.506707)">costs 6.6 of 41 points, and still beats</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="307.918622" transform="rotate(-0 36.216 307.918622)">the full state heuristic by a wide margin.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="330.330537" transform="rotate(-0 36.216 330.330537)">The frozen backbone beats a trained one,</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="36.216" y="352.742451" transform="rotate(-0 36.216 352.742451)">t of 3.97, and buys alignment of 0.754.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a12a2a" x="337.536" y="238.427291" transform="rotate(-0 337.536 238.427291)">WHAT DID NOT</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="337.536" y="263.094792" transform="rotate(-0 337.536 263.094792)">Reconstruction is 100 times better on</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="337.536" y="285.506707" transform="rotate(-0 337.536 285.506707)">hidden cells, yet the decision was worse</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="337.536" y="307.918622" transform="rotate(-0 337.536 307.918622)">in 0 of 9 configurations. Of 4.3 points</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="337.536" y="330.330537" transform="rotate(-0 337.536 330.330537)">lost, 3.4 are a representation artefact</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="337.536" y="352.742451" transform="rotate(-0 337.536 352.742451)">and 0.86 a real cost under a hard budget.</text>
   </g>
   <g id="text_19">
    <text style="font-style: italic; font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(22.266 392.042439)">Bounded by one property of this field: fire covers 1.3 percent of cells, so assuming nothing burns where you cannot</text>
    <text style="font-style: italic; font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(22.266 407.172439)">see is close to the base rate and costs almost nothing. On a dense field such as flood depth this could invert,</text>
    <text style="font-style: italic; font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(22.266 422.302439)">which is the next experiment worth running.</text>
   </g>
  </g>
 </g>
