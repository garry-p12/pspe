   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="29.52" y="30.371168" transform="rotate(-0 29.52 30.371168)">Model based decision systems fail silently</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(29.52 51.585)">Every component metric below improved, or looked correct, while the decision degraded or the constraint was violated. Each metric is computed</text>
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(29.52 67.905)">inside the model's own account of the world. The right hand column is the measurement that exposed the gap.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f6b4f" x="37.89" y="102.780997" transform="rotate(-0 37.89 102.780997)">THE COMPONENT LOOKED CORRECT BY</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a12a2a" x="325.26" y="102.780997" transform="rotate(-0 325.26 102.780997)">BUT IN FACT</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="102.780997" transform="rotate(-0 581.94 102.780997)">THE MEASUREMENT THAT EXPOSED IT</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="41.238" y="148.255844" transform="rotate(-0 41.238 148.255844)">surrogate episode cost, dual satisfied</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 141.358344)">7.3 percent of evaluations violated</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 156.015531)">the true limit</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="148.255844" transform="rotate(-0 581.94 148.255844)">probe the true environment periodically</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="41.238" y="192.607844" transform="rotate(-0 41.238 192.607844)">one step forecast skill</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 185.710344)">open loop rollout invents a fire</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 200.367531)">that does not exist</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="192.607844" transform="rotate(-0 581.94 192.607844)">synchronise to observation, compare to open loop</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="41.238" y="236.959844" transform="rotate(-0 41.238 236.959844)">faithfulness 0.47 against 0.18, t of 21</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 230.062344)">briefs carry zero state specific</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 244.719531)">information</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="236.959844" transform="rotate(-0 581.94 236.959844)">permutation control, score against another state</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 274.414344)">cost separates between doing nothing</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 288.209344)">and acting greedily</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 275.276531)">methods were ranked inside a</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 288.209344)">7 percent achievable band</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="281.311844" transform="rotate(-0 581.94 281.311844)">return separation, not only cost separation</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 318.766344)">four constrained RL baselines appeared</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 332.561344)">to fail structurally</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 318.766344)">they had barely moved off their</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 333.423531)">initialisation</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="325.663844" transform="rotate(-0 581.94 325.663844)">start every baseline where the method starts</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 363.118344)">reconstruction precision 0.594 against</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(41.238 377.321492)">0.006, about 100 times better</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 363.980531)">the decision was worse in</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 376.913344)">0 of 9 configurations</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="370.015844" transform="rotate(-0 581.94 370.015844)">score the belief on the decision it produces</text>
   </g>
   <g id="text_24">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="41.238" y="414.367844" transform="rotate(-0 41.238 414.367844)">a margin cut violations about 7 times</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 407.878492)">no stated failure rate, and the first</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #a12a2a" transform="translate(325.26 421.265344)">conformal attempt made things worse</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="581.94" y="414.367844" transform="rotate(-0 581.94 414.367844)">conformalise the distribution that actually violates</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #1f6b4f" transform="translate(123.413875 475.166725)">The positive results share one shape: measure the quantity that actually matters, which is real cost, observed</text>
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #1f6b4f" transform="translate(299.963625 491.806725)">state, or decision outcome, and the system works.</text>
   </g>
  </g>
 </g>
