[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pspe"
version = "0.1.0"
description = "PSPE: Perceive-Simulate-Plan-Explain, a zero-paid-API research stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Everything here is free / open-source. No paid API keys anywhere in the stack.
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "hydra-core>=1.3",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Phase 3/4 backbones. Optional so Phases 0-2 run with zero downloads.
llm = [
    "transformers>=4.44",
    "peft>=0.11",
    "accelerate>=0.33",
    "pillow>=10.0",
]
# Third-party reference implementations. Optional: the repo ships its own
# FNO / DeepONet / GNOT / safe-RL implementations so nothing here is required.
extras = [
    "neuraloperator>=1.0",
    "py-pde>=0.37",
]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[tool.setuptools.packages.find]
include = ["pspe*", "baselines*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=1200"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: multi-minute training checks (safe-RL convergence). Run with `make test`.",
    "canary: external-benchmark correctness checks, run manually (see docs).",
]
